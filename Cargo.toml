[package]
name = "pq"
version = "0.1.0"
edition = "2024"

[dependencies]
# ! tokio = { version = "1.48.0", features = ["full"] }
tokio = { version = "1", default-features = false, features = [
    "rt",      # single-threaded runtime
    "fs",      # file I/O
    "io-util", # stdin/stdout
    "sync",    # mpsc, oneshot, Mutex, RwLock
] }


# sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
clap = { version = "4.5.51", features = ["derive"] }
# starlark = "0.13.0"
crossterm = "0.29.0"
serde_json = { version = "1.0.145", features = ["preserve_order"] }

thiserror = "2.0.17"
ariadne = "0.6.0"
# expr-lang = "0.3.2"

# For adding Rust extension types into Starlark
# allocative = "0.3.4"
# starlark_derive = "0.13.0"
# derive_more = { version = "2.0.1", features = ["display"] }

pom = { version = "3.4.0", optional = true }
pyo3 = { version = "0.21.2", features = ["auto-initialize"], optional = true }
regex = { version = "1.10.5", features = [], optional = true }
rustpython-parser = { version = "0.3.1", features = [], optional = true }

[features]
tokenizer-pom = ["pom"]
query-engine-pyo3 = ["pyo3"]
query-parser-rustpython = ["rustpython-parser", "regex"]

# default = []
# log_n_indentation = []
# implicit_row_ids = []
