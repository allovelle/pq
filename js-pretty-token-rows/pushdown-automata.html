<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON PDA Tokenizer</title>
    <link rel="stylesheet" href="css.css">
</head>

<body>
    <h1>JSON PDA Tokenizer with State Transition Table</h1>
    <textarea id="input" placeholder='Enter JSON here, e.g.: {"name": "John", "age": 30, "active": true}'></textarea>

    <h2>State Transition Table</h2>
    <div id="stateTable"></div>

    <h2>Tokens</h2>
    <div id="tokens"></div>

    <h2>Rows</h2>
    <table id="rows">
        <thead>
            <tr>
                <th class="id-col">ID</th>
                <th class="id-col">Parent</th>
                <th class="type-col">Type</th>
                <th class="key-col">Key</th>
                <th class="value-col">Value</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        // PDA State Transition Table
        const STATE_TRANSITION_TABLE = {
            // State: { input_char: { nextState, action, emit?, push?, pop? } }
            START: {
                '{': { next: 'OBJ_START', action: 'EMIT_NEW_OBJ', push: 'OBJ' },
                '[': { next: 'ARR_START', action: 'EMIT_NEW_ARR', push: 'ARR' },
                ' ': { next: 'START', action: 'SKIP' },
                '\n': { next: 'START', action: 'SKIP' },
                '\t': { next: 'START', action: 'SKIP' },
                '\r': { next: 'START', action: 'SKIP' }
            },
            OBJ_START: {
                '"': { next: 'IN_KEY', action: 'START_KEY' },
                '}': { next: 'AFTER_VALUE', action: 'EMIT_END_OBJ', pop: true },
                ' ': { next: 'OBJ_START', action: 'SKIP' },
                '\n': { next: 'OBJ_START', action: 'SKIP' },
                '\t': { next: 'OBJ_START', action: 'SKIP' },
                '\r': { next: 'OBJ_START', action: 'SKIP' }
            },
            IN_KEY: {
                '"': { next: 'AFTER_KEY', action: 'END_KEY' },
                '\\': { next: 'IN_KEY_ESC', action: 'ESCAPE' },
                'default': { next: 'IN_KEY', action: 'APPEND' }
            },
            IN_KEY_ESC: {
                'default': { next: 'IN_KEY', action: 'APPEND' }
            },
            AFTER_KEY: {
                ':': { next: 'EXPECT_VALUE', action: 'EMIT_COLON' },
                ' ': { next: 'AFTER_KEY', action: 'SKIP' },
                '\n': { next: 'AFTER_KEY', action: 'SKIP' },
                '\t': { next: 'AFTER_KEY', action: 'SKIP' },
                '\r': { next: 'AFTER_KEY', action: 'SKIP' }
            },
            EXPECT_VALUE: {
                '"': { next: 'IN_STRING', action: 'START_STRING' },
                '{': { next: 'OBJ_START', action: 'EMIT_NEW_OBJ', push: 'OBJ' },
                '[': { next: 'ARR_START', action: 'EMIT_NEW_ARR', push: 'ARR' },
                't': { next: 'IN_TRUE_1', action: 'START_LITERAL' },
                'f': { next: 'IN_FALSE_1', action: 'START_LITERAL' },
                'n': { next: 'IN_NULL_1', action: 'START_LITERAL' },
                '-': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '0': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '1': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '2': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '3': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '4': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '5': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '6': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '7': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '8': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '9': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                ' ': { next: 'EXPECT_VALUE', action: 'SKIP' },
                '\n': { next: 'EXPECT_VALUE', action: 'SKIP' },
                '\t': { next: 'EXPECT_VALUE', action: 'SKIP' },
                '\r': { next: 'EXPECT_VALUE', action: 'SKIP' }
            },
            IN_STRING: {
                '"': { next: 'AFTER_VALUE', action: 'EMIT_STRING' },
                '\\': { next: 'IN_STRING_ESC', action: 'ESCAPE' },
                'default': { next: 'IN_STRING', action: 'APPEND' }
            },
            IN_STRING_ESC: {
                'default': { next: 'IN_STRING', action: 'APPEND' }
            },
            IN_NUMBER: {
                '0': { next: 'IN_NUMBER', action: 'APPEND' },
                '1': { next: 'IN_NUMBER', action: 'APPEND' },
                '2': { next: 'IN_NUMBER', action: 'APPEND' },
                '3': { next: 'IN_NUMBER', action: 'APPEND' },
                '4': { next: 'IN_NUMBER', action: 'APPEND' },
                '5': { next: 'IN_NUMBER', action: 'APPEND' },
                '6': { next: 'IN_NUMBER', action: 'APPEND' },
                '7': { next: 'IN_NUMBER', action: 'APPEND' },
                '8': { next: 'IN_NUMBER', action: 'APPEND' },
                '9': { next: 'IN_NUMBER', action: 'APPEND' },
                '.': { next: 'IN_NUMBER', action: 'APPEND' },
                'e': { next: 'IN_NUMBER', action: 'APPEND' },
                'E': { next: 'IN_NUMBER', action: 'APPEND' },
                '+': { next: 'IN_NUMBER', action: 'APPEND' },
                '-': { next: 'IN_NUMBER', action: 'APPEND' },
                'default': { next: 'AFTER_VALUE', action: 'EMIT_NUMBER_BACK' }
            },
            IN_TRUE_1: { 'r': { next: 'IN_TRUE_2', action: 'APPEND' } },
            IN_TRUE_2: { 'u': { next: 'IN_TRUE_3', action: 'APPEND' } },
            IN_TRUE_3: { 'e': { next: 'AFTER_VALUE', action: 'EMIT_TRUE' } },
            IN_FALSE_1: { 'a': { next: 'IN_FALSE_2', action: 'APPEND' } },
            IN_FALSE_2: { 'l': { next: 'IN_FALSE_3', action: 'APPEND' } },
            IN_FALSE_3: { 's': { next: 'IN_FALSE_4', action: 'APPEND' } },
            IN_FALSE_4: { 'e': { next: 'AFTER_VALUE', action: 'EMIT_FALSE' } },
            IN_NULL_1: { 'u': { next: 'IN_NULL_2', action: 'APPEND' } },
            IN_NULL_2: { 'l': { next: 'IN_NULL_3', action: 'APPEND' } },
            IN_NULL_3: { 'l': { next: 'AFTER_VALUE', action: 'EMIT_NULL' } },
            AFTER_VALUE: {
                ',': { next: 'AFTER_COMMA', action: 'EMIT_COMMA' },
                '}': { next: 'AFTER_VALUE', action: 'EMIT_END_OBJ', pop: true },
                ']': { next: 'AFTER_VALUE', action: 'EMIT_END_ARR', pop: true },
                ' ': { next: 'AFTER_VALUE', action: 'SKIP' },
                '\n': { next: 'AFTER_VALUE', action: 'SKIP' },
                '\t': { next: 'AFTER_VALUE', action: 'SKIP' },
                '\r': { next: 'AFTER_VALUE', action: 'SKIP' }
            },
            AFTER_COMMA: {
                '"': { next: 'IN_KEY_OR_STRING', action: 'START_STRING' },
                '{': { next: 'OBJ_START', action: 'EMIT_NEW_OBJ', push: 'OBJ' },
                '[': { next: 'ARR_START', action: 'EMIT_NEW_ARR', push: 'ARR' },
                't': { next: 'IN_TRUE_1', action: 'START_LITERAL' },
                'f': { next: 'IN_FALSE_1', action: 'START_LITERAL' },
                'n': { next: 'IN_NULL_1', action: 'START_LITERAL' },
                '-': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '0': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '1': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '2': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '3': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '4': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '5': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '6': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '7': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '8': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '9': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                ' ': { next: 'AFTER_COMMA', action: 'SKIP' },
                '\n': { next: 'AFTER_COMMA', action: 'SKIP' },
                '\t': { next: 'AFTER_COMMA', action: 'SKIP' },
                '\r': { next: 'AFTER_COMMA', action: 'SKIP' }
            },
            IN_KEY_OR_STRING: {
                '"': { next: 'AFTER_KEY_OR_STRING', action: 'END_STRING' },
                '\\': { next: 'IN_KEY_OR_STRING_ESC', action: 'ESCAPE' },
                'default': { next: 'IN_KEY_OR_STRING', action: 'APPEND' }
            },
            IN_KEY_OR_STRING_ESC: {
                'default': { next: 'IN_KEY_OR_STRING', action: 'APPEND' }
            },
            AFTER_KEY_OR_STRING: {
                ':': { next: 'EXPECT_VALUE', action: 'EMIT_KEY_COLON' },
                ',': { next: 'AFTER_COMMA', action: 'EMIT_STRING_COMMA' },
                '}': { next: 'AFTER_VALUE', action: 'EMIT_STRING_END_OBJ', pop: true },
                ']': { next: 'AFTER_VALUE', action: 'EMIT_STRING_END_ARR', pop: true },
                ' ': { next: 'AFTER_KEY_OR_STRING', action: 'SKIP' },
                '\n': { next: 'AFTER_KEY_OR_STRING', action: 'SKIP' },
                '\t': { next: 'AFTER_KEY_OR_STRING', action: 'SKIP' },
                '\r': { next: 'AFTER_KEY_OR_STRING', action: 'SKIP' }
            },
            ARR_START: {
                '"': { next: 'IN_STRING', action: 'START_STRING' },
                '{': { next: 'OBJ_START', action: 'EMIT_NEW_OBJ', push: 'OBJ' },
                '[': { next: 'ARR_START', action: 'EMIT_NEW_ARR', push: 'ARR' },
                ']': { next: 'AFTER_VALUE', action: 'EMIT_END_ARR', pop: true },
                't': { next: 'IN_TRUE_1', action: 'START_LITERAL' },
                'f': { next: 'IN_FALSE_1', action: 'START_LITERAL' },
                'n': { next: 'IN_NULL_1', action: 'START_LITERAL' },
                '-': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '0': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '1': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '2': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '3': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '4': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '5': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '6': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '7': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '8': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                '9': { next: 'IN_NUMBER', action: 'START_NUMBER' },
                ' ': { next: 'ARR_START', action: 'SKIP' },
                '\n': { next: 'ARR_START', action: 'SKIP' },
                '\t': { next: 'ARR_START', action: 'SKIP' },
                '\r': { next: 'ARR_START', action: 'SKIP' }
            }
        };

        function tokenizePDA(json) {
            const tokens = [];
            const stack = [];
            let state = 'START';
            let buffer = '';
            let i = 0;

            function peekStack() {
                return stack.length > 0 ? stack[stack.length - 1] : null;
            }

            while (i < json.length) {
                const ch = json[i];
                const transitions = STATE_TRANSITION_TABLE[state];

                if (!transitions) {
                    console.error('Invalid state:', state);
                    break;
                }

                const transition = transitions[ch] || transitions['default'];

                if (!transition) {
                    console.error('No transition for char:', ch, 'in state:', state);
                    i++;
                    continue;
                }

                const { next, action, push, pop } = transition;

                // Execute action
                switch (action) {
                    case 'SKIP':
                        break;
                    case 'EMIT_NEW_OBJ':
                        tokens.push({ type: 'new-obj', value: '{' });
                        break;
                    case 'EMIT_END_OBJ':
                        tokens.push({ type: 'end-obj', value: '}' });
                        break;
                    case 'EMIT_NEW_ARR':
                        tokens.push({ type: 'new-arr', value: '[' });
                        break;
                    case 'EMIT_END_ARR':
                        tokens.push({ type: 'end-arr', value: ']' });
                        break;
                    case 'EMIT_COLON':
                        tokens.push({ type: 'colon', value: ':' });
                        break;
                    case 'EMIT_COMMA':
                        tokens.push({ type: 'comma', value: ',' });
                        break;
                    case 'START_KEY':
                    case 'START_STRING':
                    case 'START_LITERAL':
                    case 'START_NUMBER':
                        buffer = ch;
                        break;
                    case 'APPEND':
                        buffer += ch;
                        break;
                    case 'ESCAPE':
                        break;
                    case 'END_KEY':
                        tokens.push({ type: 'txt-key', value: buffer });
                        buffer = '';
                        break;
                    case 'EMIT_STRING':
                        tokens.push({ type: 'txt', value: buffer });
                        buffer = '';
                        break;
                    case 'EMIT_NUMBER_BACK':
                        tokens.push({ type: 'num', value: buffer });
                        buffer = '';
                        i--;
                        break;
                    case 'EMIT_TRUE':
                        tokens.push({ type: 'bit', value: 'true' });
                        buffer = '';
                        break;
                    case 'EMIT_FALSE':
                        tokens.push({ type: 'bit', value: 'false' });
                        buffer = '';
                        break;
                    case 'EMIT_NULL':
                        tokens.push({ type: 'nil', value: 'null' });
                        buffer = '';
                        break;
                    case 'END_STRING':
                        break;
                    case 'EMIT_KEY_COLON':
                        tokens.push({ type: 'txt-key', value: buffer });
                        tokens.push({ type: 'colon', value: ':' });
                        buffer = '';
                        break;
                    case 'EMIT_STRING_COMMA':
                        tokens.push({ type: 'txt', value: buffer });
                        tokens.push({ type: 'comma', value: ',' });
                        buffer = '';
                        break;
                    case 'EMIT_STRING_END_OBJ':
                        tokens.push({ type: 'txt', value: buffer });
                        tokens.push({ type: 'end-obj', value: '}' });
                        buffer = '';
                        break;
                    case 'EMIT_STRING_END_ARR':
                        tokens.push({ type: 'txt', value: buffer });
                        tokens.push({ type: 'end-arr', value: ']' });
                        buffer = '';
                        break;
                }

                // Stack operations
                if (push) {
                    stack.push(push);
                }
                if (pop) {
                    stack.pop();
                }

                state = next;
                i++;
            }

            return tokens;
        }

        // Row Parser State Transition Table
        const ROW_PARSER_TABLE = {
            // State: { token_type: { nextState, action } }
            START: {
                'new-obj': { next: 'IN_OBJ', action: 'EMIT_NEW_OBJ_PUSH' },
                'new-arr': { next: 'IN_ARR', action: 'EMIT_NEW_ARR_PUSH' }
            },
            IN_OBJ: {
                'txt-key': { next: 'AFTER_KEY', action: 'STORE_KEY' },
                'end-obj': { next: 'AFTER_VALUE', action: 'EMIT_END_OBJ_POP' }
            },
            AFTER_KEY: {
                'colon': { next: 'EXPECT_VALUE', action: 'SKIP' }
            },
            EXPECT_VALUE: {
                'txt': { next: 'AFTER_VALUE', action: 'EMIT_VALUE_CLEAR_KEY' },
                'num': { next: 'AFTER_VALUE', action: 'EMIT_VALUE_CLEAR_KEY' },
                'bit': { next: 'AFTER_VALUE', action: 'EMIT_VALUE_CLEAR_KEY' },
                'nil': { next: 'AFTER_VALUE', action: 'EMIT_VALUE_CLEAR_KEY' },
                'new-obj': { next: 'IN_OBJ', action: 'EMIT_NEW_OBJ_PUSH' },
                'new-arr': { next: 'IN_ARR', action: 'EMIT_NEW_ARR_PUSH' }
            },
            IN_ARR: {
                'txt': { next: 'AFTER_VALUE', action: 'EMIT_VALUE_WITH_INDEX' },
                'num': { next: 'AFTER_VALUE', action: 'EMIT_VALUE_WITH_INDEX' },
                'bit': { next: 'AFTER_VALUE', action: 'EMIT_VALUE_WITH_INDEX' },
                'nil': { next: 'AFTER_VALUE', action: 'EMIT_VALUE_WITH_INDEX' },
                'new-obj': { next: 'IN_OBJ', action: 'EMIT_NEW_OBJ_PUSH' },
                'new-arr': { next: 'IN_ARR', action: 'EMIT_NEW_ARR_PUSH' },
                'end-arr': { next: 'AFTER_VALUE', action: 'EMIT_END_ARR_POP' }
            },
            AFTER_VALUE: {
                'comma': { next: 'AFTER_COMMA', action: 'INC_ARRAY_INDEX' },
                'end-obj': { next: 'AFTER_VALUE', action: 'EMIT_END_OBJ_POP' },
                'end-arr': { next: 'AFTER_VALUE', action: 'EMIT_END_ARR_POP' }
            },
            AFTER_COMMA: {
                'txt-key': { next: 'AFTER_KEY', action: 'STORE_KEY' },
                'txt': { next: 'AFTER_VALUE', action: 'EMIT_VALUE_WITH_INDEX' },
                'num': { next: 'AFTER_VALUE', action: 'EMIT_VALUE_WITH_INDEX' },
                'bit': { next: 'AFTER_VALUE', action: 'EMIT_VALUE_WITH_INDEX' },
                'nil': { next: 'AFTER_VALUE', action: 'EMIT_VALUE_WITH_INDEX' },
                'new-obj': { next: 'IN_OBJ', action: 'EMIT_NEW_OBJ_PUSH' },
                'new-arr': { next: 'IN_ARR', action: 'EMIT_NEW_ARR_PUSH' }
            }
        };

        function tokensToRows(tokens) {
            const rows = [];
            const ctx = {
                id: 0,
                currentKey: '',
                parentStack: [null],
                containerStack: [],
                arrayIndexStack: []
            };

            let state = 'START';

            for (const token of tokens) {
                const transition = ROW_PARSER_TABLE[state]?.[token.type];
                if (!transition) continue;

                const { next, action } = transition;
                const parentId = ctx.parentStack[ctx.parentStack.length - 1];
                const isInArray = ctx.containerStack[ctx.containerStack.length - 1] === 'array';

                switch (action) {
                    case 'SKIP':
                        break;
                    case 'STORE_KEY':
                        ctx.currentKey = token.value;
                        break;
                    case 'EMIT_NEW_OBJ_PUSH':
                        const objId = ctx.id++;
                        rows.push({ id: objId, parentId, type: 'new-obj', key: ctx.currentKey, value: '{' });
                        ctx.parentStack.push(objId);
                        ctx.containerStack.push('object');
                        ctx.currentKey = '';
                        break;
                    case 'EMIT_END_OBJ_POP':
                        rows.push({ id: ctx.id++, parentId, type: 'end-obj', key: '', value: '}' });
                        ctx.parentStack.pop();
                        ctx.containerStack.pop();
                        break;
                    case 'EMIT_NEW_ARR_PUSH':
                        const arrId = ctx.id++;
                        rows.push({ id: arrId, parentId, type: 'new-arr', key: ctx.currentKey, value: '[' });
                        ctx.parentStack.push(arrId);
                        ctx.containerStack.push('array');
                        ctx.arrayIndexStack.push(0);
                        ctx.currentKey = '';
                        break;
                    case 'EMIT_END_ARR_POP':
                        rows.push({ id: ctx.id++, parentId, type: 'end-arr', key: '', value: ']' });
                        ctx.parentStack.pop();
                        ctx.containerStack.pop();
                        ctx.arrayIndexStack.pop();
                        break;
                    case 'EMIT_VALUE_CLEAR_KEY':
                        rows.push({ id: ctx.id++, parentId, type: token.type, key: ctx.currentKey, value: token.value });
                        ctx.currentKey = '';
                        break;
                    case 'EMIT_VALUE_WITH_INDEX':
                        const key = isInArray ? String(ctx.arrayIndexStack[ctx.arrayIndexStack.length - 1]) : ctx.currentKey;
                        rows.push({ id: ctx.id++, parentId, type: token.type, key, value: token.value });
                        break;
                    case 'INC_ARRAY_INDEX':
                        if (isInArray) ctx.arrayIndexStack[ctx.arrayIndexStack.length - 1]++;
                        break;
                }

                state = next;
            }

            return rows;
        }

        function renderStateTable() {
            const states = Object.keys(STATE_TRANSITION_TABLE);
            const allInputs = new Set();

            states.forEach(state => {
                Object.keys(STATE_TRANSITION_TABLE[state]).forEach(input => {
                    allInputs.add(input);
                });
            });

            const sortedInputs = Array.from(allInputs).sort();

            let html = '<table class="state-table"><thead><tr><th>State</th>';
            sortedInputs.forEach(input => {
                const display = input === 'default' ? 'other' :
                    input === ' ' ? 'SPC' :
                        input === '\n' ? 'NL' :
                            input === '\t' ? 'TAB' :
                                input === '\r' ? 'CR' : input;
                html += `<th>${display}</th>`;
            });
            html += '</tr></thead><tbody>';

            states.forEach(state => {
                html += `<tr><td><strong>${state}</strong></td>`;
                sortedInputs.forEach(input => {
                    const trans = STATE_TRANSITION_TABLE[state][input];
                    if (trans) {
                        const stackOp = trans.push ? '↓' + trans.push.substring(0, 1) :
                            trans.pop ? '↑' : '';
                        html += `<td>${trans.next}<br/><small>${trans.action.substring(0, 10)}${stackOp}</small></td>`;
                    } else {
                        html += '<td>-</td>';
                    }
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            document.getElementById('stateTable').innerHTML = html;
        }

        function renderTokens(tokens) {
            const output = document.getElementById('tokens');
            output.innerHTML = tokens.map(t =>
                `<span class="token ${t.type}">${t.type}: ${t.value}</span>`
            ).join('');
        }

        function renderRows(rows) {
            const tbody = document.querySelector('#rows tbody');
            tbody.innerHTML = rows.map(r =>
                `<tr>
                    <td class="id-col">${r.id}</td>
                    <td class="id-col">${r.parentId !== null ? r.parentId : ''}</td>
                    <td class="type-col">${r.type}</td>
                    <td class="key-col">${r.key}</td>
                    <td class="value-col">${r.value}</td>
                </tr>`
            ).join('');
        }

        document.getElementById('input').addEventListener('input', (e) => {
            const tokens = tokenizePDA(e.target.value);
            renderTokens(tokens);

            const rows = tokensToRows(tokens);
            renderRows(rows);
        });

        // Initial render
        renderStateTable();
        const example = '{"name": "John", "age": 30, "active": true, "tags": ["a", "b"]}';
        document.getElementById('input').value = example;
        const tokens = tokenizePDA(example);
        renderTokens(tokens);
        renderRows(tokensToRows(tokens));
    </script>
</body>
